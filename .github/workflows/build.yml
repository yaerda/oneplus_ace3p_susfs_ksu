name: Build KernelSU Next + SUSFS

on:
  workflow_dispatch:
    inputs:
      SUSFS_VERSION:
        description: 'SUSFS fix patch 版本'
        default: 'v1.5.12'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: 最大化磁盘空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git curl python3 zip bc bison flex \
            libssl-dev libelf-dev gcc g++ make cpio
          curl -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          chmod a+x /usr/local/bin/repo
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"

      - name: 同步内核源码
        run: |
          mkdir kernel && cd kernel
          repo init \
            -u https://github.com/OnePlusOSS/kernel_manifest.git \
            -b refs/heads/oneplus/sm8650 \
            -m oneplus_ace3_pro_v.xml \
            --depth=1 --repo-rev=v2.16
          repo sync -c -j$(nproc --all) --no-tags --fail-fast

      - name: 设置 KernelSU Next
        working-directory: kernel/kernel_platform
        run: |
          # 去除 -dirty 标记：修改 setlocalversion 脚本
          sed -i 's/ -dirty//g' common/scripts/setlocalversion
          sed -i 's/ -dirty//g' msm-kernel/scripts/setlocalversion
          # 去除 -dirty 标记：让 git 认为工作区干净
          git -C common update-index --assume-unchanged \
            $(git -C common ls-files -m 2>/dev/null | head -100) 2>/dev/null || true
          git -C msm-kernel update-index --assume-unchanged \
            $(git -C msm-kernel ls-files -m 2>/dev/null | head -100) 2>/dev/null || true
          rm -f common/android/abi_gki_protected_exports_* || true
          rm -f msm-kernel/android/abi_gki_protected_exports_* || true
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          echo "KSU_VERSION=$(expr $(git -C KernelSU-Next rev-list --count HEAD) + 10200)" >> $GITHUB_ENV

      - name: 应用 SUSFS 补丁
        working-directory: kernel
        env:
          SUSFS_FIX_VERSION: ${{ github.event.inputs.SUSFS_VERSION }}
        run: |
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1 --depth=1
          git clone https://github.com/WildKernels/kernel_patches.git --depth=1

          # 复制 SUSFS 内核文件
          cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch kernel_platform/common/
          cp susfs4ksu/kernel_patches/fs/susfs.c kernel_platform/common/fs/
          cp susfs4ksu/kernel_patches/include/linux/susfs.h \
             susfs4ksu/kernel_patches/include/linux/susfs_def.h \
             kernel_platform/common/include/linux/

          # 应用 SUSFS GKI 主补丁
          cd kernel_platform/common
          patch -p1 < 50_add_susfs_in_gki-android14-6.1.patch || true

          # 应用 KernelSU-Next SUSFS fix patches
          cd ../../kernel_platform/KernelSU-Next
          PATCHES_DIR="../../kernel_patches/next/susfs_fix_patches/${SUSFS_FIX_VERSION}"
          if [ -d "$PATCHES_DIR" ]; then
            for patch in "$PATCHES_DIR"/*.patch; do
              echo "Applying: $patch"
              patch -p1 -F 3 < "$patch" || true
            done
          else
            echo "::error::找不到补丁目录: $PATCHES_DIR"
            exit 1
          fi

          # 应用 next_hooks 补丁
          cp ../../kernel_patches/next/next_hooks.patch ./
          patch -p1 -F 3 < next_hooks.patch || true

      - name: 启用 SUSFS CONFIG
        working-directory: kernel/kernel_platform
        run: |
          # 找到 GKI common defconfig 并强制启用 SUSFS 所有选项
          DEFCONFIG="common/arch/arm64/configs/gki_defconfig"
          
          echo "=== 添加 SUSFS CONFIG 到 $DEFCONFIG ==="
          cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          EOF
          
          echo "=== 同时写入 msm-kernel defconfig ==="
          MSMD="msm-kernel/arch/arm64/configs/vendor/pineapple-gki_defconfig"
          if [ -f "$MSMD" ]; then
            cat >> "$MSMD" << 'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          EOF
          fi

          echo "=== 验证写入 ==="
          grep "SUSFS" "$DEFCONFIG" | head -10

      - name: 编译内核
        working-directory: kernel
        run: |
          ./kernel_platform/oplus/build/oplus_build_kernel.sh pineapple gki 2>&1 | tee /tmp/build.log
          if [ ! -f out/dist/Image ]; then
            echo "::error::编译失败，out/dist/Image 不存在"
            grep -E "^.*error:.*$" /tmp/build.log | tail -20
            exit 1
          fi
          echo "✅ Image 编译成功: $(ls -lh out/dist/Image)"
          # 验证 SUSFS 编译进去了
          grep -c "susfs" /tmp/build.log && echo "✅ SUSFS 出现在编译日志" || echo "⚠️ SUSFS 未出现在编译日志"

      - name: 打包 AnyKernel3
        working-directory: kernel
        run: |
          git clone https://github.com/Kernel-SU/AnyKernel3 --depth=1
          rm -rf AnyKernel3/.git
          cp out/dist/Image AnyKernel3/
          ZIPNAME="Anykernel3-KSUN-SUSFS-${KSU_VERSION}-OnePlus_ACE_3_Pro.zip"
          cd AnyKernel3
          zip -r "../$ZIPNAME" ./*
          echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV

      - name: 上传 AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: Anykernel3-KSUN-SUSFS-OnePlus_ACE_3_Pro
          path: kernel/Anykernel3-KSUN-SUSFS-*.zip
          retention-days: 7

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 3
